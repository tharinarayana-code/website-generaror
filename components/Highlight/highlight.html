<section class="highlight card component-card shadow-sm border-0 mb-4 mt-4">
    <div>
        <div class="card-header component-header">
            <h4><i class="bi bi-stars me-2"></i>Highlight Strip</h4>
            <small class="text-muted">Optional message displayed between sections.</small>
        </div>
        <div class="component-body">
            <label for="highlight-tagline" class="form-label">
                <i class="bi bi-megaphone me-2"></i>
                Highlight Message (Short message you want to emphasize)
            </label>
            <textarea id="highlight-tagline" class="form-control" rows="3" maxlength="150" placeholder="[Example: Fresh ingredients. Friendly service. Every day.]"></textarea>
            <div class="form-text">Optional • Max 150 characters.</div>
        </div>
    </div>
</section>
